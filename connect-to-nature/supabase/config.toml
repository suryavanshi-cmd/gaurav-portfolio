# Supabase CLI project settings.
#
#   supabase link --project-ref <your-project-ref>
#   supabase db push        # applies supabase/migrations to the linked project
#   supabase db reset       # locally: recreate, migrate, then run seed.sql
#
# project_id is only a local label; the linked project comes from `supabase link`.

project_id = "connect-to-nature"

[db]
port = 54322
major_version = 16

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://shetkari.localhost:3000"]
jwt_expiry = 3600
enable_signup = true

# Phone sign-in is the one that matters for host adoption: a farmer has a number
# they answer and often no email they check. Configure a provider (Twilio,
# MessageBird, Textlocal) in the dashboard before enabling this in production.
[auth.sms]
enable_signup = true
enable_confirmations = false

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"

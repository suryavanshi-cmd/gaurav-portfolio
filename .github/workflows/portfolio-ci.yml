name: Portfolio CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/**
      - feature/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # What the assistant is allowed to say is decided by a handful of
      # thresholds in components/rag/answer.js. Loosen them and it starts
      # answering questions the site has no answer to; tighten them and the
      # questions it offers on its own empty state refuse. Neither shows up in
      # a build, so the suite runs before it.
      - name: Grounding and refusal
        run: npm test

      - name: Build Next.js application
        run: npm run build

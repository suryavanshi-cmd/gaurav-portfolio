name: Portfolio CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/**
      - feature/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Two suites, one step. The engines (QueryLite, Raft, CRDT) are the
      # kind of code a build cannot vouch for at all. The assistant's are
      # thresholds in components/rag/answer.js: loosen them and it answers
      # questions the site has no answer to, tighten them and the questions it
      # offers on its own empty state refuse. Neither failure shows up in a
      # build, so both run before it.
      - name: Engines, grounding and refusal
        run: npm test

      - name: Build Next.js application
        run: npm run build

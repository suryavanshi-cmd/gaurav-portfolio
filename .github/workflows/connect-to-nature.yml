name: Connect to Nature

# The app and the database are checked separately, because they fail
# separately: a build error is caught by tsc and next build, and a broken
# migration is only ever caught by applying it to a real PostgreSQL server.
#
# The deploy job applies migrations to a Supabase project when the repository
# has the secrets for one. Without them it is skipped, which is also what makes
# this workflow safe to run on a fork.

on:
  pull_request:
    branches: [main]
    paths:
      - 'connect-to-nature/**'
      - '.github/workflows/connect-to-nature.yml'
  push:
    branches:
      - main
      - 'claude/**'
      - 'agent/**'
      - 'feature/**'
    paths:
      - 'connect-to-nature/**'
      - '.github/workflows/connect-to-nature.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: connect-to-nature

jobs:
  app:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: connect-to-nature/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Every dictionary carries every key
        run: node scripts/check-i18n.mjs

      - name: The generated seed matches seed-content.ts
        run: |
          node scripts/generate-seed.mjs
          git diff --exit-code -- supabase/seed.sql \
            || (echo "::error::supabase/seed.sql is out of date — run node scripts/generate-seed.mjs and commit it" && exit 1)

      - run: npm run typecheck

      - name: Build
        run: npm run build

  database:
    name: Migrations, seed and row-level security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Apply every migration, the seed, and the assertions
        run: ./scripts/check-sql.sh

  deploy-database:
    name: Push migrations to Supabase
    needs: [app, database]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Are the Supabase secrets set?
        id: secrets
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$PROJECT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID are not set — skipping the database deploy."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest

      - name: supabase db push
        if: steps.secrets.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          supabase db push
